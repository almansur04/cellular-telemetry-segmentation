# Reproducible project metadata and shared random seed
project:
  name: cellular-telemetry-segmentation
  random_seed: 42

# Raw and derived dataset locations
data:
  csv_path: data/webbrowsing.csv
  cleaned_parquet_path: data/webbrowsing_cleaned.parquet

# Canonical mapping between analysis concepts and dataset columns
columns:
  timestamp: test_time
  target: page_download_speed
  device: device_model
  device_code: device_model_code
  cell: cell_id
  network: network_type
  url: url
  rsrp: signal_strength
  latency: page_response_latency
  ping: ping_time
  active_speed: speed
  response: response_flag
  app_version: app_version

# Controlled regime used for device-model comparisons
device_analysis:
  reference_url: https://yandex.kz/
  allowed_networks:
    - 5G
    - LTE+
  rsrp_min_dbm: -80
  min_device_sessions: 50

  # Reference levels used for cell-adjusted regression coefficients
  reference_device: SM-A266B
  reference_network: 5G

  bootstrap_iterations: 2000
  confidence_level: 0.95

# Cell-level quality, impact, and operational triage configuration
cell_analysis:
  minimum_sessions_per_cell: 100

  latency_failure_ms: 1500
  throughput_failure_mbps: 0.5

  throughput_urls:
    - https://yandex.kz/
    - https://www.instagram.com
    - https://2gis.kz/

  failure_rate_threshold: 0.05
  rsrp_coverage_threshold_dbm: -95

  top_n_cells: 50
  confidence_level: 0.95

  # One-at-a-time perturbations used to evaluate classification and
  # ranking stability around the configured baseline thresholds
  sensitivity:
    latency_thresholds_ms:
      - 1000
      - 1500
      - 2000

    throughput_thresholds_mbps:
      - 0.25
      - 0.5
      - 1.0

    failure_rate_thresholds:
      - 0.02
      - 0.05
      - 0.10

    rsrp_thresholds_dbm:
      - -90
      - -95
      - -100

# Predictive modeling configuration
ml:
  test_size: 0.20

  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 2

  ridge:
    alpha: 1.0

  # Prefer chronological evaluation to reduce temporal leakage from future observations
  use_temporal_split: true
  permutation_repeats: 10

  # Exclude downstream performance variables to avoid target leakage.
  features:
    - signal_strength
    - network_type
    - device_model_code
    - url
    - hour
    - dayofweek
    - latitude
    - longitude

# Standardized output locations for tables, figures, and metrics
output:
  root: results
  figures: results/figures
  tables: results/tables
  metrics: results/metrics
